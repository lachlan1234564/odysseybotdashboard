<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odyssey Bot Login</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">
    <script src="/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <div class="login-card-header">
        <div class="brand-mark">O</div>
        <button type="button" class="theme-toggle icon-only" data-theme-toggle aria-label="Switch color theme">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
        </button>
      </div>
      <p class="eyebrow">Local administration</p>
      <h1>Odyssey Bot</h1>
      <p class="muted">Enter the dashboard password from your local environment.</p>
      <form id="login-form">
        <label for="password">Admin password</label>
        <div class="password-control">
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <button type="button" id="toggle-password" class="password-toggle" aria-controls="password" aria-pressed="false" aria-label="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 12s3.5-6 9.6-6 9.6 6 9.6 6-3.5 6-9.6 6-9.6-6-9.6-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10 10 0 0 1 12 6c6.1 0 9.6 6 9.6 6a16 16 0 0 1-2.3 3M6.2 6.3C3.8 8 2.4 12 2.4 12s3.5 6 9.6 6a9 9 0 0 0 3-.5M9.9 9.8a3 3 0 0 0 4.2 4.3"/></svg>
          </button>
        </div>
        <button type="submit">Open dashboard</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </main>
  </body>
</html>
